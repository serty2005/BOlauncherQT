name: Build and Release EXE

on:
  push:
    branches:
      - main

jobs:
  build-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Extract version from commit message
        id: version
        shell: pwsh
        run: |
          $message = @'
${{ github.event.head_commit.message }}
'@
          $subject = ($message -split "`r?`n")[0].Trim()

          if ($subject -match '^(v(?<version>\d+(?:\.\d+)*))(?:-|$)') {
            "matched=true" >> $env:GITHUB_OUTPUT
            "tag=$($Matches[1])" >> $env:GITHUB_OUTPUT
            "version=$($Matches['version'])" >> $env:GITHUB_OUTPUT
            Write-Host "Release version detected: $($Matches['version'])"
          } else {
            "matched=false" >> $env:GITHUB_OUTPUT
            Write-Host "Commit '$subject' is not a release commit. Skipping build and release."
          }

      - name: Checkout code
        if: steps.version.outputs.matched == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        if: steps.version.outputs.matched == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        if: steps.version.outputs.matched == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ensure release tag exists
        if: steps.version.outputs.matched == 'true'
        shell: pwsh
        run: |
          $tag = "${{ steps.version.outputs.tag }}"
          $currentSha = (git rev-parse HEAD).Trim()
          $remoteSha = (git ls-remote --tags origin "refs/tags/$tag" | ForEach-Object {
            ($_ -split "`t")[0]
          } | Select-Object -First 1)

          if ($remoteSha) {
            $remoteSha = $remoteSha.Trim()
            if ($remoteSha -ne $currentSha) {
              throw "Tag $tag already exists on commit $remoteSha, but current commit is $currentSha."
            }

            Write-Host "Tag $tag already exists on the current commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag $tag
          git push origin $tag
          Write-Host "Created tag $tag on commit $currentSha."

      - name: Build with PyInstaller
        if: steps.version.outputs.matched == 'true'
        run: |
          pyinstaller --noconfirm --onefile --windowed --name "BO Launcher" --icon "icon.ico" --add-data "icons;icons" --add-data "translations;translations" --add-data "icon.ico;." main.py

      - name: Upload build artifact
        if: steps.version.outputs.matched == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: built-exe-${{ steps.version.outputs.tag }}
          path: "dist/BO Launcher.exe"
          if-no-files-found: error

      - name: Create GitHub Release
        if: steps.version.outputs.matched == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          files: |
            dist/BO Launcher.exe
          body: |
            Automatic release for version ${{ steps.version.outputs.version }}.
            Source commit: ${{ github.sha }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
